version: "3"
services:
  postgres-botner:
    container_name: postgres-botner
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: honza-bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: HonzaBotner
      TZ: 'Europe/Prague'
      PGTZ: 'Europe/Prague'
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honza-bot -d HonzaBotner"]
      interval: 10s
      timeout: 5s
      retries: 5
