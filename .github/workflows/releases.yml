name: GitHub Releases

on:
  push:
    tags:
      - "v*.*"
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false
    - name: Setup .NET Core
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        global-json-file: global.json
    - name: Install dependencies
      run: dotnet restore --locked-mode
    - name: Test
      run: dotnet test --configuration Release --no-restore
    - name: Restore release runtime
      run: dotnet restore src/HonzaBotner/HonzaBotner.csproj --runtime linux-musl-x64 --locked-mode
    - name: Build
      run: dotnet publish src/HonzaBotner/HonzaBotner.csproj -o botner-linux-musl-x64 -c Release -r linux-musl-x64 --no-restore --no-self-contained -p:PublishSingleFile=true
    - name: Pack the build to tar
      run: tar -czvf botner-linux-musl-x64.tar.gz botner-linux-musl-x64
    - name: Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: botner-linux-musl-x64.tar.gz
        generate_release_notes: true
